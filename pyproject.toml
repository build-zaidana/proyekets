[project]
name = "autodast-agent"
version = "0.1.0"
description = "Agentic AI DAST untuk analisis kerentanan aplikasi web secara otonom"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
