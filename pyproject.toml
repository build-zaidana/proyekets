[project]
name = "autodast-agent"
version = "0.1.0"
description = "Agentic AI DAST — worker agen Python (lihat docs/DESIGN_GUIDELINES.md)"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
